<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chorda</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111318;
    color: white;
    overflow: hidden;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

/* APP */

.app {
    height: 100vh;
    display: flex;
}

/* SERVERS */

.servers {
    width: 72px;
    background: #0b0d10;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    z-index: 30;
}

.server {
    width: 48px;
    height: 48px;
    border: 0;
    border-radius: 16px;
    background: #242833;
    color: white;
    font-weight: bold;
    font-size: 18px;
    transition: .2s;
}

.server:hover,
.server.active {
    background: #5865f2;
    border-radius: 13px;
}

.server.add {
    color: #6ee7a0;
    font-size: 24px;
}

/* CHANNELS */

.channels {
    width: 250px;
    background: #171a21;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    z-index: 20;
}

.workspace {
    height: 64px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #292d36;
    font-size: 18px;
    font-weight: bold;
}

.settings {
    color: #9ca3af;
    cursor: pointer;
}

.settings:hover {
    color: white;
}

.channel-list {
    padding: 18px 10px;
    overflow-y: auto;
    flex: 1;
}

.category {
    color: #8f96a3;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    margin: 12px 8px 8px;
}

.channel {
    padding: 10px;
    border-radius: 6px;
    color: #9ca3af;
    cursor: pointer;
    margin-bottom: 2px;
}

.channel:hover,
.channel.active {
    background: #252a35;
    color: white;
}

/* PLUS */

.plus {
    margin: 10px;
    padding: 14px;
    border-radius: 10px;
    background: linear-gradient(135deg, #292e4a, #202432);
    border: 1px solid #3a4168;
}

.plus-title {
    font-weight: bold;
    margin-bottom: 5px;
}

.plus-text {
    color: #9ca3af;
    font-size: 12px;
    line-height: 1.4;
    margin-bottom: 10px;
}

.plus-button {
    width: 100%;
    border: 0;
    padding: 8px;
    border-radius: 7px;
    background: #5865f2;
    color: white;
    font-weight: bold;
}

/* CHAT */

.chat {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

.chat-header {
    height: 64px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #171a21;
    border-bottom: 1px solid #292d36;
    font-weight: bold;
    flex-shrink: 0;
}

.mobile-menu {
    display: none;
    border: 0;
    background: transparent;
    color: white;
    font-size: 22px;
    padding: 5px;
}

.channel-icon {
    color: #8f96a3;
    font-size: 20px;
}

/* MESSAGES */

.messages {
    flex: 1;
    padding: 25px;
    overflow-y: auto;
}

.welcome {
    padding: 20px;
    border-radius: 10px;
    background: #1d222b;
    margin-bottom: 25px;
}

.welcome h2 {
    margin: 0 0 8px;
}

.welcome p {
    color: #9ca3af;
    margin: 0;
}

.message {
    display: flex;
    gap: 12px;
    padding: 8px;
    border-radius: 6px;
}

.message:hover {
    background: rgba(255,255,255,.03);
}

.avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #5865f2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: bold;
    flex-shrink: 0;
}

.message-content {
    min-width: 0;
}

.username {
    font-weight: bold;
}

.timestamp {
    margin-left: 8px;
    color: #737b89;
    font-size: 11px;
}

.message-text {
    margin-top: 4px;
    color: #d5d9e0;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

/* INPUT */

.message-area {
    padding: 12px 20px 18px;
}

.message-box {
    display: flex;
    align-items: center;
    background: #20242d;
    border-radius: 9px;
    padding: 5px 10px;
}

.message-box input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: white;
    padding: 12px;
}

.message-box button {
    border: 0;
    background: #5865f2;
    color: white;
    padding: 9px 14px;
    border-radius: 7px;
    font-weight: bold;
}

/* MEMBERS */

.members {
    width: 230px;
    background: #171a21;
    border-left: 1px solid #292d36;
    padding: 20px 12px;
    overflow-y: auto;
    flex-shrink: 0;
}

.members-title {
    color: #8f96a3;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    margin-bottom: 12px;
}

.member {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 6px;
}

.member:hover {
    background: #252a35;
}

.member-name {
    font-size: 14px;
}

.online {
    width: 8px;
    height: 8px;
    background: #57d68a;
    border-radius: 50%;
    margin-left: auto;
}

/* MOBILE OVERLAY */

.mobile-overlay {
    display: none;
}

/* TABLET */

@media (max-width: 1000px) {

    .members {
        display: none;
    }

}

/* MOBILE */

@media (max-width: 650px) {

    .servers {
        width: 58px;
        padding: 8px;
    }

    .server {
        width: 42px;
        height: 42px;
    }

    .channels {
        position: fixed;
        left: 58px;
        top: 0;
        bottom: 0;
        width: 250px;
        transform: translateX(-110%);
        transition: transform .2s ease;
        box-shadow: 20px 0 50px rgba(0,0,0,.5);
    }

    .channels.open {
        transform: translateX(0);
    }

    .mobile-menu {
        display: block;
    }

    .mobile-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.55);
        z-index: 10;
    }

    .mobile-overlay.show {
        display: block;
    }

    .messages {
        padding: 15px;
    }

    .message-area {
        padding: 10px;
    }

    .chat-header {
        padding: 0 12px;
    }

}
</style>
</head>

<body>

<div class="app">

    <!-- SERVERS -->

    <aside class="servers">

        <button class="server active">
            C
        </button>

        <button class="server">
            G
        </button>

        <button class="server">
            S
        </button>

        <button
            class="server add"
            onclick="comingSoon('Server creation')"
        >
            +
        </button>

    </aside>


    <!-- CHANNELS -->

    <aside class="channels" id="channels">

        <div class="workspace">

            <span>Chorda</span>

            <span
                class="settings"
                onclick="comingSoon('Settings')"
            >
                ⚙
            </span>

        </div>


        <div class="channel-list">

            <div class="category">
                Welcome
            </div>

            <div
                class="channel active"
                data-channel="general"
            >
                # general
            </div>

            <div
                class="channel"
                data-channel="announcements"
            >
                # announcements
            </div>


            <div class="category">
                Community
            </div>

            <div
                class="channel"
                data-channel="chat"
            >
                # chat
            </div>

            <div
                class="channel"
                data-channel="memes"
            >
                # memes
            </div>

            <div
                class="channel"
                data-channel="support"
            >
                # support
            </div>


            <div class="category">
                Voice
            </div>

            <div
                class="channel"
                onclick="comingSoon('Voice channels')"
            >
                🔊 Lounge
            </div>

            <div
                class="channel"
                onclick="comingSoon('Voice channels')"
            >
                🔊 Gaming
            </div>

        </div>


        <div class="plus">

            <div class="plus-title">
                ✦ Chorda Plus
            </div>

            <div class="plus-text">
                Premium features are coming soon.
            </div>

            <button
                class="plus-button"
                onclick="comingSoon('Chorda Plus')"
            >
                Coming Soon
            </button>

        </div>

    </aside>


    <!-- CHAT -->

    <main class="chat">

        <header class="chat-header">

            <button
                class="mobile-menu"
                id="mobileMenu"
            >
                ☰
            </button>

            <span class="channel-icon">
                #
            </span>

            <span id="channelName">
                general
            </span>

        </header>


        <div
            class="messages"
            id="messages"
        >

            <div class="welcome">

                <h2 id="welcomeTitle">
                    Welcome to #general 👋
                </h2>

                <p>
                    This is the beginning of this channel.
                </p>

            </div>

            <div id="messageList"></div>

        </div>


        <div class="message-area">

            <div class="message-box">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Message #general"
                    autocomplete="off"
                >

                <button id="sendButton">
                    Send
                </button>

            </div>

        </div>

    </main>


    <!-- MEMBERS -->

    <aside class="members">

        <div class="members-title">
            Online — 4
        </div>

        <div class="member">

            <div class="avatar">
                AX
            </div>

            <div class="member-name">
                Alex
            </div>

            <div class="online"></div>

        </div>

        <div class="member">

            <div class="avatar">
                SK
            </div>

            <div class="member-name">
                Sky
            </div>

            <div class="online"></div>

        </div>

        <div class="member">

            <div class="avatar">
                JM
            </div>

            <div class="member-name">
                Jamie
            </div>

            <div class="online"></div>

        </div>

        <div class="member">

            <div class="avatar">
                RB
            </div>

            <div class="member-name">
                Riley
            </div>

            <div class="online"></div>

        </div>

    </aside>

</div>


<!-- MOBILE OVERLAY -->

<div
    class="mobile-overlay"
    id="mobileOverlay"
></div>


<script>

const channelData = {

    general: [
        {
            name: "Alex",
            avatar: "AX",
            text: "Welcome to Chorda!",
            time: "Today at 7:01 PM"
        },
        {
            name: "Sky",
            avatar: "SK",
            text: "This is the general channel.",
            time: "Today at 7:04 PM"
        }
    ],

    announcements: [
        {
            name: "Alex",
            avatar: "AX",
            text: "Welcome to the announcements channel.",
            time: "Today at 6:55 PM"
        }
    ],

    chat: [
        {
            name: "Jamie",
            avatar: "JM",
            text: "Hey everyone! What's happening?",
            time: "Today at 6:42 PM"
        }
    ],

    memes: [
        {
            name: "Sky",
            avatar: "SK",
            text: "This channel is ready for memes 😂",
            time: "Today at 6:30 PM"
        }
    ],

    support: [
        {
            name: "Riley",
            avatar: "RB",
            text: "Need help? Ask your question here.",
            time: "Today at 6:15 PM"
        }
    ]

};


const channels =
    document.querySelectorAll(
        ".channel[data-channel]"
    );

const channelName =
    document.getElementById(
        "channelName"
    );

const welcomeTitle =
    document.getElementById(
        "welcomeTitle"
    );

const messageList =
    document.getElementById(
        "messageList"
    );

const messages =
    document.getElementById(
        "messages"
    );

const input =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const mobileMenu =
    document.getElementById(
        "mobileMenu"
    );

const channelsPanel =
    document.getElementById(
        "channels"
    );

const mobileOverlay =
    document.getElementById(
        "mobileOverlay"
    );


let currentChannel = "general";


function createMessage(
    name,
    avatar,
    text,
    time,
    shouldScroll = true
) {

    const message =
        document.createElement("div");

    message.className = "message";


    const avatarElement =
        document.createElement("div");

    avatarElement.className = "avatar";

    avatarElement.textContent = avatar;


    const content =
        document.createElement("div");

    content.className =
        "message-content";


    const header =
        document.createElement("div");


    const username =
        document.createElement("span");

    username.className =
        "username";

    username.textContent =
        name;


    const timestamp =
        document.createElement("span");

    timestamp.className =
        "timestamp";

    timestamp.textContent =
        time;


    header.appendChild(username);

    header.appendChild(timestamp);


    const textElement =
        document.createElement("div");

    textElement.className =
        "message-text";

    textElement.textContent =
        text;


    content.appendChild(header);

    content.appendChild(textElement);


    message.appendChild(avatarElement);

    message.appendChild(content);


    messageList.appendChild(message);


    if (shouldScroll) {

        messages.scrollTop =
            messages.scrollHeight;

    }

}


function loadChannel(name) {

    currentChannel = name;

    channelName.textContent = name;

    welcomeTitle.textContent =
        "Welcome to #" + name + " 👋";

    input.placeholder =
        "Message #" + name;

    messageList.innerHTML = "";


    if (!channelData[name]) {
        channelData[name] = [];
    }


    channelData[name].forEach(
        function(message) {

            createMessage(
                message.name,
                message.avatar,
                message.text,
                message.time,
                false
            );

        }
    );


    messages.scrollTop =
        messages.scrollHeight;

}


channels.forEach(
    function(channel) {

        channel.addEventListener(
            "click",
            function() {

                channels.forEach(
                    function(item) {

                        item.classList.remove(
                            "active"
                        );

                    }
                );


                channel.classList.add(
                    "active"
                );


                loadChannel(
                    channel.dataset.channel
                );


                closeMobileMenu();

            }
        );

    }
);


function sendMessage() {

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    const now =
        new Date();


    const time =
        now.toLocaleTimeString(
            [],
            {
                hour: "numeric",
                minute: "2-digit"
            }
        );


    if (!channelData[currentChannel]) {

        channelData[currentChannel] = [];

    }


    channelData[currentChannel].push({

        name: "You",

        avatar: "YO",

        text: text,

        time: "Today at " + time

    });


    createMessage(
        "You",
        "YO",
        text,
        "Today at " + time
    );


    input.value = "";

}


sendButton.addEventListener(
    "click",
    sendMessage
);


input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);


mobileMenu.addEventListener(
    "click",
    function() {

        channelsPanel.classList.add(
            "open"
        );

        mobileOverlay.classList.add(
            "show"
        );

    }
);


function closeMobileMenu() {

    channelsPanel.classList.remove(
        "open"
    );

    mobileOverlay.classList.remove(
        "show"
    );

}


mobileOverlay.addEventListener(
    "click",
    closeMobileMenu
);


function comingSoon(feature) {

    alert(
        feature +
        " is coming soon!"
    );

}


loadChannel("general");

</script>

</body>
</html>
